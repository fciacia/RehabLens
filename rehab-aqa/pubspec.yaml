name: ryo
description: "On-device rehabilitation exercise quality assessment (BlazePose + lightweight TCN)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  # Vision & Pose (on-device; no video to cloud)
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.14.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Audio
  flutter_tts: ^4.2.0

  # Utilities
  path: ^1.9.0
  path_provider: ^2.1.5
  path_provider_foundation: 2.4.0
  shared_preferences: ^2.3.3
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  logger: ^2.4.0
  freezed_annotation: ^2.4.4

  # PDF report for doctor / user (Review flow)
  pdf: ^3.11.0
  printing: ^5.13.0
  sqflite: ^2.4.2+1
  tflite_flutter: ^0.12.1
  sensors_plus: ^7.1.1
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/models/
    - assets/shaders/
